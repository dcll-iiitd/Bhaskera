# jevos yes/no decisions on the GPU through llama.cpp (serve.backend: decision).
#   bhaskera-serve --config configs/serve_jevos.yaml --ray-address local
#   curl localhost:PORT/v1/systemone -H 'Content-Type: application/json' -d '{"model": "jev-latest",
#     "state": "I was charged twice.", "questions": {"billing": {"type": "noul",
#     "instructions": "Is this a billing problem?"}}}'
model:
  name: jevos          # label only; the weights come from model.gguf
  gguf: jevos-q8_0     # registry name from configs/models/gguf.yaml, or a path to a .gguf file

serve:
  backend: decision
  num_replicas: 1
  ray_actor_options:
    num_gpus: auto     # auto = 1 / num_replicas: every replica shares one GPU
  # Unauthenticated API: bind loopback only. Use the gateway for authenticated external
  # access; set host: 0.0.0.0 only on a trusted network.
  host: 127.0.0.1
  port: 0
  decision:
    registry: configs/models/gguf.yaml
    models_dir: ~/.cache/bhaskera/gguf
    device: cuda
    ctx: 8192
    batch_size: 4
    prefill_chunk: 512
    # auto resolves to seq-copy for jevos (faster on multi-question requests; answers drift up to
    # 0.053 (q8_0) from upstream jev on the same GPU). state-restore gives upstream-identical
    # answers and is faster on short single-question requests (188.8 vs 166.3 req/s on
    # bench_short_q1) but slower on long multi-question ones (52.1 vs 89.6 req/s on bench_long_q3).
    branch: auto
    calibration: null
    max_ongoing_requests: 4
    batching:
      enabled: false
      max_batch_size: 8
      batch_wait_timeout_s: 0.005
    llama_cpp:
      accelerator: cuda
      cache_dir: ~/.cache/bhaskera/llama.cpp
  gateway:
    enabled: false
    proxy_port: 0
    cloudflared: false
