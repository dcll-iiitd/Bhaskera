# configs/serve-thinking.yaml
# Works with: DeepSeek-R1-Distill, Qwen3, QwQ, or any <think>…</think> model.
# Install:  pip install "bhaskera[serve,vllm]"
# Run:      bhaskera-serve --config configs/serve-thinking.yaml

model:
  name: "aaditya/Llama3-OpenBioLLM-8B"
  dtype: "bfloat16"

serve:
  backend: "vllm"                  # swap to "hf" if vLLM not installed
  host: "0.0.0.0"
  port: 8000
  num_replicas: 1
  ray_actor_options:
    num_gpus: 1
  vllm:
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.92
    max_model_len: 8192           # must fit prompt + full thinking chain

inference:
  max_new_tokens: 256            # <-- critical: thinking chain eats tokens fast
  temperature: 0.6                 # recommended for R1-class models
  top_p: 0.95
  do_sample: true
