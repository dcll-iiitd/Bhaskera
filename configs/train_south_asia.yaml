plugins:
  optimizers:
    - "bhaskera.plugins.optimizers.muon"

model:
  name: "allenai/OLMo-2-1124-7B-Instruct"
  dtype: "bfloat16"
  attn_impl: "sdpa"
  trust_remote_code: false

data:
  name: "local"
  format: "chatml"
  train_path: "/mnt/disk1/slakshna/training/Bhaskera/dataset/South_Asia.jsonl"
  seq_len: 2048
  num_workers: 4
  tokenized_path: "/mnt/disk1/slakshna/training/Bhaskera/cache/local_train_e5a7a539a76181d0"
  overwrite_cache: false

lora:
  enabled: true
  r: 256
  alpha: 32
  dropout: 0.05
  target_modules: ["auto"]
  include_experts: false
  freeze_router: true
  modules_to_save: []

training:
  batch_size: 1
  grad_accum: 8
  lr: 2.0e-5
  weight_decay: 0.01
  max_steps: 100
  num_epochs: 1
  warmup_steps: 10
  max_grad_norm: 1.0
  seed: 42
  deterministic: false

  optimizer:
    backend: "plugin"
    name: "muon"
    kwargs:
      lr: 2.0e-5
      momentum: 0.95
      weight_decay: 0.01
      optim_bits: 8
      adjust_lr: null

  distributed:
    strategy: "fsdp"
    fsdp:
      sharding_strategy: "FULL_SHARD"
      transformer_layer_cls: []
      param_dtype: "bfloat16"
      reduce_dtype: "bfloat16"
      buffer_dtype: "bfloat16"
      activation_checkpointing: true
      cpu_offload: false
      shard_experts_individually: false

checkpoint:
  enabled: true
  save_dir: "/mnt/disk1/slakshna/training/Bhaskera/checkpoints/south_asia"
  save_interval: 1
  keep_last_n: 2

logging:
  tracker: "wandb"
  project: "bhaskera-olmo2"
  run_name: "Muon-olmo2-7b-instruct-south-asia"
  log_gpu_every_n_steps: 10

monitoring:
  dashboard_port: 18265
