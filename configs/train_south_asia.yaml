plugins:
  optimizers:
    - "bhaskera.plugins.optimizers.muon"

model:
  name: "allenai/OLMo-2-1124-7B-Instruct"
  dtype: "bfloat16"
  attn_impl: "sdpa"
  trust_remote_code: false

data:
  name: "local"
  format: "chatml"
  train_path: "/mnt/disk1/slakshna/training/Bhaskera/dataset/South_Asia.jsonl"
  seq_len: 2048
  num_workers: 8
  tokenized_path: "/mnt/disk1/slakshna/training/Bhaskera/cache/local_train_079a0daaff30bc4e" # /mnt/disk1/slakshna/training/Bhaskera/cache/local_train_079a0daaff30bc4e
  overwrite_cache: false
  pack_sequences: True
  tokenize_compression: "snappy"
  tokenize_batch_size: 256


lora:
  enabled: true
  r: 16
  alpha: 64
  dropout: 0.03
  target_modules: ["auto"]
  include_experts: false
  freeze_router: true
  modules_to_save: []

training:
  batch_size: 4
  grad_accum: 8
  lr: 3.0e-4
  weight_decay: 0.01
  max_steps: 50
  num_epochs: 10
  warmup_steps: 5
  max_grad_norm: 1.0
  seed: 42
  deterministic: false

  optimizer:
    backend: "plugin"
    name: "muon"
    kwargs:
      lr: 3.0e-4
      momentum: 0.95
      weight_decay: 0.01
      optim_bits: 8

  distributed:
    strategy: "fsdp"
    fsdp:
      sharding_strategy: "FULL_SHARD"
      transformer_layer_cls: []
      param_dtype: "bfloat16"
      reduce_dtype: "bfloat16"
      buffer_dtype: "bfloat16"
      activation_checkpointing: true
      cpu_offload: false
      shard_experts_individually: false

checkpoint:
  enabled: true
  save_dir: "/mnt/disk1/slakshna/training/Bhaskera/checkpoints/south_asia"
  save_interval: 1
  keep_last_n: 2

logging:
  tracker: "wandb"
  project: "after-pack_seq"
  run_name: "with_correct_token_path"
  log_gpu_every_n_steps: 10

monitoring:
  dashboard_port: 18265
